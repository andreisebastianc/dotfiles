# Setting the prefix from C-b to C-a; C-a C-a sends a literal C-a through
# (nvim increment, readline line start).
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# tmux's fallback is screen-256color, whose terminfo has no undercurl —
# nvim's LSP squiggles degrade to plain underlines inside tmux.
# Older macOS has no tmux-256color terminfo entry; stay on the fallback
# there rather than break every program that looks TERM up.
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
	'set -g default-terminal "tmux-256color"' \
	'set -g default-terminal "screen-256color"'

# Let nvim see FocusGained/FocusLost (autoread, checktime).
set -g focus-events on

set -g history-limit 50000

# Pass modified keys (C-S-p, C-S-n, …) through to nvim; without this
# tmux flattens them to plain C-p / C-n.
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

#setting the delay between prefix and command
set -s escape-time 1

# Set the base index for windows to 1 instead of 0
set -g base-index 1

# Set the base index for panes to 1 instead of 0
setw -g pane-base-index 1

# splitting panes with | and -
bind | split-window -h
bind - split-window -v

# moving between panes with Prefix h,j,k,l
bind h select-pane -L 
bind j select-pane -D 
bind k select-pane -U 
bind l select-pane -R

# Jump to (or create) a project session with tmux-sessionizer.
# Replaces the default find-window binding.
bind f run-shell "tmux neww tmux-sessionizer"

# Quick window selection
bind -r C-h select-window -t :- 
bind -r C-l select-window -t :+

bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

set -g mouse on

# set colors for the active window
setw -g window-status-current-style fg=white,bold,bg=darkgreen

# Status line left side to show Session:window:pane
set -g status-left-length 40
set -g status-left "#[fg=darkgreen]Session: #S #[fg=darkgreen]#I #[fg=cyan]#P"

# enable activity alerts
setw -g monitor-activity on
set -g visual-activity on

set-option -g allow-passthrough on
